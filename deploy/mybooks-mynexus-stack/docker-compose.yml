# MyBooks + MyNexus 二合一编排（同一 docker 网络，容器名互通）
# 部署后：MyBooks 设置页的 MyNexus 开关/URL/Token 已自动填好，
#         你只需在下面 .env 里填自己的 LLM Key。
services:
  mybooks:
    image: ${MYBOOKS_IMAGE:-mybooks:4.7.0-build.09}
    container_name: mybooks
    restart: always
    # 启动命令在编排层也钉死一次：用 /bin/sh 显式读脚本，不依赖 start.sh 的可执行位。
    # 双保险——即便用了旧镜像（start.sh 是 644），容器也不会再报 permission denied
    # 反复重启；新镜像本身 CMD 也已改成同样的写法（见 Dockerfile）。
    command: ["/bin/sh", "/var/www/mybooks/docker/start.sh"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "${HTTP_PORT:-9800}:80"
      # HTTPS（镜像自带自签证书，与旧部署的 8443 保持一致；不需要可删这行）
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # MyBooks 全部数据（书库/数据库/设置/日志）都在这一个目录，备份就备份它
      - ${DATA_DIR:-./data}:/data
      # ★ 预置 MyNexus 设置：manual.py 是设置加载链的最后一级（优先级最高），
      #   prebuilt 里没有同名文件、不会被首次启动的拷贝覆盖；token 从环境变量读，
      #   做到单一配置源（只需在 .env 里填一次）。打开设置页即自动填好。
      - ./settings/manual.py:/data/books/settings/manual.py:ro
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Shanghai}
      # HuggingFace 镜像（沿用你现有环境，避免模型下载卡住）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      # 供挂载的 manual.py 读取：URL 用容器名（同网络内可解析），token 单一来源
      MYNEXUS_AUTO_URL: ${MYNEXUS_AUTO_URL:-http://mynexus}
      MYNEXUS_API_TOKEN: ${MYNEXUS_API_TOKEN}
      # 全局 AI 助手配置（manual.py 读取，预填到设置页）
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-openrouter/free}
      AI_MCP_TOKEN: ${AI_MCP_TOKEN:-}
    depends_on:
      - mynexus

  mynexus:
    image: ${MYNEXUS_IMAGE:-poxenstudio/mynexus:latest}
    container_name: mynexus
    restart: unless-stopped
    ports:
      # MyNexus 管理后台宿主端口，默认 3000（官方默认，8083 在部分 NAS 上被占用）
      - "${MYNEXUS_PORT:-3000}:80"
    volumes:
      # ★★ AI 解析的书籍数据（mynexus.db / vectorstore / uploads / logs）和配置（config.yaml）
      #   用绝对路径挂到【deploy-stack 之外】。原先写 ./mynexus-data、./mynexus-config，
      #   目录就在 deploy-stack 里；onekey 升级把 deploy-stack 改名 .old 后，新栈是空目录，
      #   数据全被埋进旧目录、看起来「没了」。改成 .env 指定的绝对路径后，升级改名不再影响。
      - ${MYNEXUS_DATA_DIR:-./mynexus-data}:/data
      - ${MYNEXUS_CONFIG_DIR:-./mynexus-config}:/config
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Asia/Shanghai}
      # HuggingFace 镜像：MyNexus 首次启动下载 embedding 模型，国内必须走镜像
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      # MyBooks 用它来连 MyNexus，必须和上面 MYNEXUS_API_TOKEN 一致
      MYNEXUS_API_TOKEN: ${MYNEXUS_API_TOKEN}
      # —— LLM：默认 DeepSeek（OpenAI 兼容）——
      #   ★ 模型配置单一来源 = 本文件同目录的 .env。环境变量优先级高于设置页 config.yaml：
      #     worker 读 MYNEXUS_LLM_* 时会覆盖 config.yaml，所以改模型只需改 .env 的 LLM_*，
      #     不必进 MyNexus 设置页「LLM」标签页填写（填了也会被 env 覆盖，反而误导）。
      #   ★ URL 只写到域名根：worker 自己拼 /chat/completions（见源码 openai_llm.py）。
      #     填 https://api.deepseek.com/v1 → 请求 /v1/chat/completions（可用）；
      #     填 .../chat/completions → 变成 .../chat/completions/chat/completions → 404。
      MYNEXUS_LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      MYNEXUS_LLM_OPENAI_API_KEY: ${LLM_API_KEY}
      MYNEXUS_LLM_OPENAI_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      MYNEXUS_LLM_OPENAI_MODEL: ${LLM_MODEL:-deepseek-flash}
      MYNEXUS_LLM_OPENAI_TIMEOUT: ${LLM_TIMEOUT:-90}
      # —— Embedding：镜像内置本地 ONNX 模型（fastembed，模型在 /usr/share/models）——
      #   显式钉死为 local + 内置路径：即使旧 config.yaml 里残留云端/别的模型名，
      #   也会被 env 覆盖回内置模型，彻底免下载、免在设置页「嵌入」标签页配置。
      MYNEXUS_EMBEDDING_PROVIDER: ${MYNEXUS_EMBEDDING_PROVIDER:-local}
      MYNEXUS_EMBEDDING_LOCAL_MODEL: ${MYNEXUS_EMBEDDING_LOCAL_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      MYNEXUS_EMBEDDING_LOCAL_MODEL_PATH: ${MYNEXUS_EMBEDDING_LOCAL_MODEL_PATH:-/usr/share/models}

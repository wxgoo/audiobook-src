upstream tornado {
    server 127.0.0.1:8000;
}

upstream myreader {
    server 127.0.0.1:9100;
}

# 多层nginx的情况下，X-Scheme可能已经被设置过了，需要判断下
map $http_x_scheme $req_scheme {
    default   $http_x_scheme;
    ""        $scheme;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 【安全优化 1】通过 map 规避 location 内部的 if ( $request_uri ~* ^/get/ ) 逻辑
# /get/tool/ 是 Toolbox 外部工具前端（index.html), 不做缓存，方便及时更新
map $request_uri $get_expires {
    ~*^/get/tool/    -1s;
    ~*^/get/         max;
    default          -1s;
}

# 修复多层代理时 X-Forwarded-Host/Proto 丢失端口问题
map $http_x_forwarded_host $my_real_host {
    "" $http_host;
    default $http_x_forwarded_host;
}
map $http_x_forwarded_proto $my_real_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}
map $http_x_forwarded_port $my_real_port {
    "" $server_port;
    default $http_x_forwarded_port;
}

server {
    listen 80;
    listen 443 ssl;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;
    http2 on;
    server_name _;

    ssl_certificate     /data/books/ssl/ssl.crt;
    ssl_certificate_key /data/books/ssl/ssl.key;

    index index.html;
    client_max_body_size 0;
    root /var/www/mybooks/app/dist/;
    access_log  /data/log/nginx/mybooks-access.log;
    error_log   /data/log/nginx/mybooks-error.log;

    # 【扫描器屏蔽】互联网扫描器高频探测的路径（phpinfo/wp-admin/.env/.git 等）
    # 直接断开连接（444 = nginx 静默关闭，不返回任何响应），且不写 access log，
    # 避免日志被垃圾请求刷屏。注意：本站合法路径（/api|/get|/read/...）不含
    # 这些后缀，books 的 .epub/.pdf/.fb2 等格式不受影响。
    location ~* \.(php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|bak|sql|yml|yaml|conf|log|sh)$ {
        access_log off;
        return 444;
    }
    location ~* ^/(\.git|\.svn|\.env|\.DS_Store|wp-admin|wp-content|wp-login|xmlrpc|phpmyadmin|phpMyAdmin|actuator|telemetry|cdn-cgi) {
        access_log off;
        return 444;
    }

    # 兼容 /opds 和 /opds/ 两种访问方式（安全，未带问号和未命名变量）
    location = /opds {
        rewrite ^ /opds/ last;
    }

    # WebDAV 服务
    location /books {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header Range $http_range;
        proxy_pass_request_headers on;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        expires -1s;
    }

    location /podcast {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        expires -1s;
    }

    location /wap {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        expires -1s;
    }

    # /api/book/<id>/filepath（内嵌阅读器用 bookId+format 查询书籍物理路径
    location ~ ^/api/book/[0-9]+/filepath$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/user/whoami（内嵌阅读器的身份桥接端点，见 §5.3）没有单独限制来源——
    # 它只是把请求带的 cookie 解析成身份信息返回，不带 cookie 时直接 user.need_login，
    # 不构成"任意查询他人身份"的探测接口；拿到的信息不超过一个已经持有该 cookie
    # 的调用方本来就能拿到的（直接拿这个 cookie 调其它接口效果一样），所以跟随下面的
    # 通配规则一起代理给 Tornado 即可，不需要额外的 IP 限制。

    # MyReader（内嵌阅读器），见 document/MyReader_Embedded_WebApp.md（myreader 仓库）。
    # 只代理阅读入口实际用到的路径，不接管 MyReader 自己的书架/OPDS/分享等页面——
    # 那些路径在这套合并部署里仍然属于 MyBooks（例如 /opds 已经被下面的通配规则
    # 占用），内嵌阅读流程也从不跳转到那些页面。
    #
    # /api/mybooks/ 需要 `^~` 前缀匹配，让它在 nginx 的匹配优先级上盖过下面的
    # ^/(api|get|read|opds|auth)/ 正则（否则 /api/mybooks/whoami 这类路径会被
    # 正则规则截走，代理到 tornado 而不是 myreader）。
    location ^~ /api/mybooks/ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;

        # 【繁体书卡死修复】MyReader 的阅读流程会经这个前缀整本取 epub：
        #   local-file 取物理路径 → download 回整个 epub 二进制流。
        # 之前这里没有任何超时/缓冲配置，全部吃 nginx 默认值：
        #   proxy_read_timeout 60s。
        # 一本几十 MB 的书在慢速外网要下几分钟，60 秒一到 nginx 主动断开上游，
        # 浏览器只看到 net::ERR_HTTP2_PROTOCOL_ERROR（4.6.0-9 用户实测两次
        # 卡顿 60.8s / 55s，正好压在 60s 超时线附近）。书拿不到 → foliate
        # 拿不到 zip 条目 → section.load 一路等到超时，表现就是"翻不动"。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时给足（这是本条唯一真正必要的修正）
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 允许 nginx 把大响应溢出到临时文件，别因默认值把响应体判为过大而失败
        proxy_max_temp_file_size 2048m;
    }

    # 阅读入口页面 + Next.js 静态资源。这条正则必须排在下面的
    # ^/(api|get|read|opds|auth)/ 之前——nginx 对同类正则 location 按文件内
    # 先后顺序取第一个匹配，不是按最长匹配。（"reader"/"myreader" 和
    # "read" 不会互相匹配，所以两条规则本身并不冲突，这里的顺序只是防御性的。）
    location ~ ^/(readerx|reader|_next|assets|fonts|images|locales|vendor)/ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;
    }

    # MyReader 的根级静态文件（app/public 下未归到上面几个子目录的部分）。
    location ~ ^/(icon|icon-tiny|apple-touch-icon|favicon|manifest)\.(png|ico|json)$ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;
    }

    # 头像等静态资源不缓存，避免多层缓存导致头像更新延迟或错误（线上 NPM 的 assets.conf 会缓存 *.png 30m）
    location ^~ /avatar/ {
        expires -1s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ =404;
        access_log off;
    }

    location /_lib/ {
        internal;
        alias /data/books/library/;
        access_log off;
    }

    location /_cache/ {
        internal;
        alias /data/cache/;
        access_log off;
    }

    # 【外网翻页优化】epub 正文资源（章节/CSS/图片）单独一段：
    # 上面通用的 ^/(api|get|read|opds|auth)/ 会套 expires $get_expires，
    # 而 /get/ 映射到 max —— 那会把 tornado 下发的 private Cache-Control 直接盖掉，
    # 变成可被中间代理/他人缓存。这里改为放行上游的 Cache-Control，
    # 并把 proxy_buffering 打开：外网带宽有限，由 nginx 先整块收完再回给客户端，
    # 避免慢客户端拖住 tornado 的工作进程。
    location ~ ^/get/extract/[0-9]+/ {
        proxy_set_header X-Accel-Support 1;

        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $my_real_host;
        proxy_set_header X-Forwarded-Proto $my_real_proto;
        proxy_set_header X-Forwarded-Port $my_real_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $my_real_proto;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 不覆盖上游 Cache-Control / ETag（缓存与 304 协商由后端决定）
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;

        # 慢速外网下别过早断开
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ ^/(api|get|read|opds|auth)/ {
        expires $get_expires;
        proxy_set_header X-Accel-Support 1;

        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $my_real_host;
        proxy_set_header X-Forwarded-Proto $my_real_proto;
        proxy_set_header X-Forwarded-Port $my_real_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $my_real_proto;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Redirect Kindle browsers to the WAP interface
    location = / {
        if ($http_user_agent ~* "kindle") {
            rewrite ^ /wap last;
        }
        expires -1s;
        try_files $uri /index.html;
    }

    location = /index.html {
        expires -1s;
    }
    try_files $uri $uri/index.html /index.html;
}

# mybooks —— 与上游一致的部署方式：成品镜像 + 只有 image，没有 build。
# 不构建、不 clone、不传大包；docker compose up -d 自动从 GHCR 拉取（公开包匿名可拉）。
services:
  mybooks:
    image: ${IMAGE_TAG:-ghcr.io/wxgoo/audiobooks:4.6.0-build.28-r42}
    container_name: ${CONTAINER_NAME:-mybooks}
    restart: always
    # 保留此项：老内核（<3.17）+ 新版 glibc 下 docx→pdf 会因 getrandom 缺失崩溃，
    # 该选项解决不了但无副作用。详见 CHANGELOG 附录的排障实录。
    security_opt:
      - seccomp:unconfined
    volumes:
      # ★ 全部数据都在这一个目录：书库、每本书的 .audio/、数据库、设置、日志、SSL 证书。
      #   备份 = 打包它；换机 = 搬它 + 用同一个镜像 tag 启动。删容器不伤数据。
      - ${DATA_DIR:-./data}:/data
    ports:
      - "${HTTP_PORT:-9800}:80"
      # HTTPS（镜像自带自签证书，开箱可起；不需要就删掉这一行）
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # PUID/PGID 必须等于宿主机数据目录所有者的 uid/gid，填错会
      # 「上传不了书 / 设置存不下 / 封面不显示」。群晖常见 1026/100，普通 Linux 1000/1000。
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}

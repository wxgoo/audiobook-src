services:

  # main service
  mybooks:
    restart: always
    # 关键：加 build 才会用本目录源码构建镜像；
    # image 只是给本地构建出的镜像打的标签，不会再去拉取远程镜像
    build:
      context: .
      args:
        # CN = 使用国内镜像源（apt/npm/pip），国内构建明显更快
        BUILD_COUNTRY: CN
        # 1 = 安装 faster-whisper（音频转写功能），0 = 不装（镜像小约 250MB）
        # 不想要转写功能就把这行改成 "0"，或整行删掉（默认 1）
        WITH_WHISPER: "1"
        # 运行期版本号：Dockerfile 会写进 webserver/version.py，容器内界面/日志显示的是它。
        # 与源码、app/package.json 保持一致（4.6.0-build.27）；由 scripts/check-version-lock.py 锁定，
        # 留空会让构建直接失败（Dockerfile 有守卫），不会写成空串。
        GIT_VERSION: "4.6.0-build.27"
      # 只构建生产阶段，跳过 test 阶段（省一次完整 pip install）
      target: production
      # 复用上一次构建的镜像层：改代码后重建只重跑变化的层
      cache_from:
        - mybooks-local:latest
    image: mybooks-local:latest
    # 2026-11-03 实测修正：docx→pdf 崩溃（"Fatal glibc error: cannot get
    # entropy for arc4random"）的根因是 **宿主机内核 3.10.108**（Braswell
    # 平台被群晖锁死），低于 getrandom() 所需的 3.17；glibc ≥ 2.36 的
    # arc4random 没有回退路径，直接 abort。与 seccomp 无关，此项**解决不了**
    # 该问题，但保留无副作用。真正可行：VMM 虚拟机跑新内核，或降级基础镜像
    # 的 glibc（calibre 连带风险大）。详见 docs/排障归档。
    security_opt:
      - seccomp:unconfined
    volumes:
      # 数据目录：书库、音频、数据库、模型缓存、日志全部在这里。
      # ★ 与源码目录分离 ★ —— rm -rf audiobook 重装源码不会伤到任何数据。
      # 目录布局（都在 /volume1/docker 下、站点目录外）：
      #   audiobook/        源码 + 部署脚本（可随意删了重解压）
      #   audiobook-data/   ★ 全部运行数据，备份只需盯住它 ★
      #   audiobook-git/    升级脚本的 git 历史（也在站点外）
      # 默认值是作者群晖的布局。别人联网全新安装时用仓库根 .env 覆盖 DATA_DIR
      # （见 .env.example / scripts/install-fresh.sh），**不要直接改本文件**，
      # 否则以后 git pull 会冲突。所有变量都有默认值，现有站点不写 .env 也完全无感。
      - ${DATA_DIR:-/volume1/docker/audiobook-data}:/data
    ports:
      # 左边是宿主机端口，浏览器访问 http://<NAS_IP>:${HTTP_PORT:-9800}
      # 8080 留给官方版 mybooks，避免冲突
      - "${HTTP_PORT:-9800}:80"
      # HTTPS（镜像自带自签证书，开箱可起；不需 HTTPS 就把这一行注释掉）
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # PUID/PGID 必须等于宿主机数据目录所有者的 uid/gid，填错会
      # 「上传不了书 / 设置存不下 / 封面不显示」。群晖常见 1026/100，
      # 普通 Linux 常见 1000/1000；别人装的时候用 .env 覆盖。
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Shanghai}

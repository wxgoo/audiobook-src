name: Sync from Gitee
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -e
          git remote add gitee https://gitee.com/wxgoo/audiobook-src.git
          git fetch --prune --tags gitee '+refs/heads/*:refs/remotes/gitee/*'
          for r in $(git for-each-ref --format='%(refname)' refs/remotes/gitee/); do
            case "$r" in *HEAD) continue ;; esac
            b=${r#refs/remotes/gitee/}
            git push --force origin "$r:refs/heads/$b"
          done
          git push --force --prune origin '+refs/tags/*:refs/tags/*'

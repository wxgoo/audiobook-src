# =============================================================================
# paths.conf —— 群晖 DSM 7 实际部署路径（由各脚本 source）
#
# 变量写法 VAR="${VAR:-默认值}"：环境变量优先，命令行参数再覆盖。
# 直接编辑本文件即可改默认值，不需要改脚本。
#
# 依据（部署包 audiobook-deploy-4.6.0-19-r13-patched.tar.gz）：
#   docker-compose.yml  第 30-48 行：卷 / 端口 / PUID / TZ / 镜像名
#   INSTALL_GUIDE.md    第 947-962 行：站点、数据、git 目录布局与备份示例
#   上传说明.md          upgrade.sh / hotfix 的 config/auto.py 路径
# =============================================================================

# 源码 + 部署脚本目录（可整个删掉重解压，不含运行数据）
# 来源：INSTALL_GUIDE 947 行、上传说明 `sh /volume1/docker/audiobook/scripts/upgrade.sh`
APP_ROOT="${APP_ROOT:-/volume1/docker/audiobook}"

# git 历史目录（站点目录内没有 .git，升级脚本把历史放在站点外）
# 来源：INSTALL_GUIDE 949、769 行
APP_GIT_DIR="${APP_GIT_DIR:-/volume1/docker/audiobook-git}"

# 站点配置目录（auto.py 等）
# 来源：上传说明 hotfix 示例 /volume1/docker/audiobook/config/auto.py
APP_CONFIG_DIR="${APP_CONFIG_DIR:-$APP_ROOT/config}"

# 运行数据目录（书库、音频、SQLite、模型、日志都在这里，备份只需盯住它）
# 来源：docker-compose.yml 37 行 `- /volume1/docker/audiobook-data:/data`
DATA_DIR="${DATA_DIR:-/volume1/docker/audiobook-data}"

# calibre 书库目录（容器内 /data/books/library）
# 来源：INSTALL_GUIDE 848 行、webserver/settings.py with_library
LIBRARY_DIR="${LIBRARY_DIR:-$DATA_DIR/books/library}"

# calibre 元数据库（容器内 /data/books/library/metadata.db）
METADATA_DB="${METADATA_DB:-$LIBRARY_DIR/metadata.db}"

# 站点 SQLite 库（容器内 /data/books/calibre-webserver.db）
WEB_DB="${WEB_DB:-$DATA_DIR/books/calibre-webserver.db}"

# 音频根目录：音频在每本书目录内的 .audio/（源码 webserver/base/audio_dir.py）
# 导入用的「有声书」暂存目录通常在 $DATA_DIR/books/有声书，是否有独立音频卷待确认
AUDIO_ROOT="${AUDIO_ROOT:-$LIBRARY_DIR}"

# 备份根目录
# 来源：INSTALL_GUIDE 962 行示例备份到 /volume1/backup/audiobook-data-<日期>
# ⚠ 待确认：若 /volume1/backup 不存在或你想备份到别的盘，改这里
BACKUP_ROOT="${BACKUP_ROOT:-/volume1/backup/audiobook}"

# 恢复演练目录与其白名单前缀（默认与备份同盘，绝不写生产数据目录）
DRILL_PREFIX="${DRILL_PREFIX:-/volume1/backup}"
DRILL_DIR="${DRILL_DIR:-$DRILL_PREFIX/audiobook-restore-drill}"

# compose 文件与工程信息
# 来源：docker-compose.yml（工程目录 audiobook → 容器 audiobook-mybooks-1）
COMPOSE_FILE="${COMPOSE_FILE:-$APP_ROOT/docker-compose.yml}"
COMPOSE_PROJECT="${COMPOSE_PROJECT:-audiobook}"
APP_SERVICE="${APP_SERVICE:-mybooks}"
APP_CONTAINER="${APP_CONTAINER:-audiobook-mybooks-1}"

# 本地构建镜像名（50/30/40 在无 python3 时用它跑一次性容器）
# 来源：docker-compose.yml 21 行 `image: mybooks-local:latest`
BACKUP_IMAGE="${BACKUP_IMAGE:-mybooks-local:latest}"

# 对外访问端口（宿主机 9800 → 容器 80；8443 → 443）
# 来源：docker-compose.yml 41、43 行
HTTP_PORT="${HTTP_PORT:-9800}"
HTTPS_PORT="${HTTPS_PORT:-8443}"

# 时区与容器运行用户（PUID/PGID 为群晖 administrators 常见值 1026/100）
# 来源：docker-compose.yml 46-48 行
TZ="${TZ:-Asia/Shanghai}"
PUID="${PUID:-1026}"
PGID="${PGID:-100}"

# 补丁目录（默认取脚本同级的 ../patches；单独拷贝 nas 目录时用 PATCHES_DIR 覆盖）
PATCHES_DIR="${PATCHES_DIR:-${SCRIPT_DIR:-.}/../patches}"

# 定时任务日志（90-cron-setup.sh 使用）
LOG_FILE="${LOG_FILE:-$BACKUP_ROOT/backup.log}"
